<script>

    // Variables de control del juego
    let opciones = ""
    let opcionesAlimento = ""
    let iteracion = 0
    let indiceArray = 0

    //Variables de la granja
    let salud = "¡Los animales están sanos!"
    let animalesNacen = 0
    let animalesMueren = 0
    let totalAnimales = 0
    let nombreEstablo = prompt("Introduce el nombre que le quieras poner a tu establo:")
    let animalSano = true
    let productosMercado = []
    let numerosProductosMercado = []
    let inventario = []
    let preciosMercado = []
    let numeroProductosMercado = 0
    let dinero = 0
    let opcionProducto = ""
    let mensaje = ""
    let gananciaMonetaria = 0

    // Constantes para las condiciones del juego
    const LIMITE_ESTIERCOL_INTERACCION = 3
    const CONDICION_ACUMULACION_ESTIERCOL = 3
    const MAX_FELICIDAD = 4
    const MAX_ALIMENTOS = 4
    const MAX_ESTIERCOL = 6
    const MIN_FELICIDAD = 0
    const MIN_ALIMENTOS = 0
    const MIN_ESTIERCOL = 0
    const CONDICION_ANIMALES_ENFERMOS = 4
    const CONDICION_FIN_JUEGO = 99
    const MAX_PRODUCTOS_MERCADO = 4
    const MAX_ITERACIONES_CAMBIO_PRODUCTOS = 5
    const COSTE_COMPRAR_COMIDA = 100
    const PRODUCTOSTOTALES = ["Bebedero de Agua 🚰 - 200G", "Refugio para Animales 🛖 - 500G", "Juguetes para Animales 🧸 - 150G", "Malla de Sombra 🏖️ - 300G", "Sistema de Riego 💧 - 400G", "Herramientas de Limpieza 🧹 - 100G", "Luz Solar Artificial 💡 - 350G", "Cercado Mejorado 🚧 - 600G"]
    const PRECIOPRODUCTOS = [200, 500, 150, 300, 400, 100, 350, 600]


    //Variables principales del estado inicial de la granja
    let felicidad = []
    for (let i = 0; i < MAX_FELICIDAD; i++) {
        felicidad.push("❤️")
    }
    let alimentosDisponibles = []
    for (let i = 0; i < MAX_ALIMENTOS; i++) {
        alimentosDisponibles.push("🌾")
    }
    let establo = []

    //Cuatro primeros productos del mercado
    for (let i = 0; i < MAX_PRODUCTOS_MERCADO; i++) {
        numeroProductosMercado = Math.floor(Math.random() * PRODUCTOSTOTALES.length)

        while (numerosProductosMercado.includes(numeroProductosMercado)) {
            numeroProductosMercado = Math.floor(Math.random() * PRODUCTOSTOTALES.length)
        }
        productosMercado.push(PRODUCTOSTOTALES[numeroProductosMercado])
        numerosProductosMercado.push(numeroProductosMercado)
        preciosMercado.push(PRECIOPRODUCTOS[numeroProductosMercado])
    }

    // Muestro el estado inicial de la granja
    alert("\nNivel de Felicidad de los Animales: " + felicidad + "\nNivel de Alimentos disponibles: " + alimentosDisponibles + "\nEstado del Establo: " + establo + "\nEstado de Salud: " + salud + "\nNúmero de Animales: " + totalAnimales + "\nDinero: " + dinero + "G" + "\nInventario: " + inventario)

    // Bucle principal del juego (se repite hasta que el número de animales llegue a 99)
    while (totalAnimales < CONDICION_FIN_JUEGO) {

        // Pido al jugador que elija una opción
        opciones = prompt("Elige una de las siguientes opciones: \n1 = 🥕 ALIMENTAR A LOS ANIMALES 🥕 \n2 = 🐑 JUGAR CON LOS ANIMALES 🐑 \n3 = 💩 LIMPIAR EL ESTABLO 💩 \n4 =  🛒 COMPRAR COMIDA 🛒 \n5 = ℹ️ CONSULTAR INFORMACIÓN ℹ️ \n6 = 👩🏻‍⚕️ CURAR A LOS ANIMALES 👩🏻‍⚕️ \n7 = 🛒 MERCADO 🛒")
        while (opciones != "1" && opciones != "2" && opciones != "3" && opciones != "4" && opciones != "5" && opciones != "6" && opciones != "7") {
            opciones = prompt("Elige una de las siguientes opciones: \n1 = 🥕 ALIMENTAR A LOS ANIMALES 🥕 \n2 = 🐑 JUGAR CON LOS ANIMALES 🐑 \n3 = 💩 LIMPIAR EL ESTABLO 💩 \n4 =  🛒 COMPRAR COMIDA  \n5 = ℹ️ CONSULTAR INFORMACIÓN ℹ️ \n6 = 👩🏻‍⚕️ CURAR A LOS ANIMALES 👩🏻‍⚕️ \n7 = 🛒 MERCADO 🛒")
        }

        // En cada iteración nacen entre 1 y 10 animales y mueren entre 1 y 5 animales.
        animalesNacen = (Math.floor(Math.random() * 10) + 1)
        animalesMueren = (Math.floor(Math.random() * 5) + 1)
        totalAnimales = totalAnimales + animalesNacen - animalesMueren
        if (totalAnimales < 0) {
            totalAnimales = 0
        }

        // Cada 3 turnos, se acumula una 💩 y baja la felicidad
        iteracion++
        if (iteracion % CONDICION_ACUMULACION_ESTIERCOL == 0) {
            if (establo.length < MAX_ESTIERCOL) establo.push("💩")
            if (felicidad.length > MIN_FELICIDAD) felicidad.pop()
            alert("Ha pasado el tiempo 🕐. El establo se ha ensuciado y los animales están un poco menos felices.")
        }

        // Estado de salud de los animales: cada 4 o más 💩 los animales enfermarán.
        if (establo.length >= CONDICION_ANIMALES_ENFERMOS) {

            salud = "Los animales están enfermos 😢"
            animalSano = false
        }

        // Opción 1 → Alimentar a los animales
        if (opciones == "1") {

            // Solo se puede alimentar si el establo tiene 3 o menos 💩
            if (establo.length <= LIMITE_ESTIERCOL_INTERACCION) {

                // Solo se puede alimentar si hay alimentos disponibles
                if (alimentosDisponibles.length > MIN_ALIMENTOS) {

                    opcionesAlimento = prompt("Elige una de las siguientes opciones: \n1 = Forraje 🌾 \n2 = Fruta 🍎")
                    while (opcionesAlimento != "1" && opcionesAlimento != "2") {
                        opcionesAlimento = prompt("Elige una de las siguientes opciones: \n1 = Forraje 🌾 \n2 = Fruta 🍎")
                    }

                    // Si se elige forraje 🌾
                    if (opcionesAlimento == "1") {

                        alimentosDisponibles.pop()
                        alert("Has alimentado a los animales con forraje 🌾. ¡Están contentos!")

                        // Si se elige fruta 🍎
                    } else {

                        // Si los animales están enfermos no se pueden alimentar
                        if (!animalSano) {
                            alert("Los animales están enfermos y no pueden comer fruta.")

                        } else {
                            alimentosDisponibles.pop()

                            if (felicidad.length < MAX_FELICIDAD) {
                                felicidad.push("❤️")
                            }
                            alert("Has alimentado a los animales con fruta 🍎. Su felicidad ha aumentado ❤️")
                        }

                    }
                } else {
                    alert("No hay alimentos disponibles")
                }
            } else {
                alert("El establo está demasiado sucio, debe limpiarlo antes de alimentar a los animales.")
            }

            // Opción 2 → Jugar con los animales
        } else if (opciones == "2") {

            // Solo se puede jugar si el establo tiene 3 o menos 💩, si los animales están sanos y si hay comida
            if (establo.length <= LIMITE_ESTIERCOL_INTERACCION && animalSano) {

                if (alimentosDisponibles.length == MIN_ALIMENTOS) {
                    alert("No hay comida suficiente para jugar con los animales 😢")

                } else {
                    if (felicidad.length < MAX_FELICIDAD) felicidad.push("❤️")
                    alimentosDisponibles.pop()
                    gananciaMonetaria = Math.floor(Math.random() * (200 - 100 + 1)) + 100
                    dinero += gananciaMonetaria
                    alert("¡Has jugado con los animales 🐑! Su felicidad ha aumentado ❤️")
                }

            } else {
                if (establo.length >= LIMITE_ESTIERCOL_INTERACCION) alert("El establo está demasiado sucio, debe limpiarlo antes de jugar con los animales.")
                else if (!animalSano) alert("Los animales están enfermos, debes curarlos antes de jugar con ellos.")
            }

            // Opción 3 → Limpiar el establo
        } else if (opciones == "3") {

            if (establo.length > MIN_ESTIERCOL) {

                // Elimina todas las 💩
                while (establo.length > MIN_ESTIERCOL) {
                    establo.pop()
                }
                alert("Has limpiado el establo 💩. ¡Todo está reluciente!")
            } else {
                alert("El establo ya estaba limpio 🧹. ¡Buen trabajo!")
            }

            // Opción 4 → Comprar comida
        } else if (opciones == "4") {

            if (dinero < COSTE_COMPRAR_COMIDA) {
                alert("No tiene suficiente dinero para comprar comida 😢")
            } else {

                // Repone la comida hasta el máximo
                while (alimentosDisponibles.length < MAX_ALIMENTOS) {
                    alimentosDisponibles.push("🌾")
                }
                dinero -= COSTE_COMPRAR_COMIDA
                alert("Has comprado comida. El almacén ahora está lleno 🌾🌾🌾🌾.")
            }

            // Opción 5 → Consultar información
        } else if (opciones == "5") {

            alert("Nombre del Establo: " + nombreEstablo + "\nNúmero de Animales: " + totalAnimales)

            // Opción 6 → Curar a los animales
        } else if (opciones == "6") {
            if (animalSano) {
                alert("Los animales ya están sanos 😊")
            } else if (establo.length > 0) {
                alert("No puedes curar a los animales si el establo no está limpio 💩")
            } else {
                animalSano = true
                salud = "¡Los animales están sanos!"
                alert("¡Has curado a los animales! 👩🏻‍⚕️")
            }

            // Opción 7 → Comprar productos
        } else {

            // Si han pasado 5 iteraciones se cambian los productos
            if (iteracion % MAX_ITERACIONES_CAMBIO_PRODUCTOS == 0) {
                productosMercado = []
                numerosProductosMercado = []
                preciosMercado = []
                for (let i = 0; i < MAX_PRODUCTOS_MERCADO; i++) {
                    numeroProductosMercado = Math.floor(Math.random() * PRODUCTOSTOTALES.length)

                    while (numerosProductosMercado.includes(numeroProductosMercado)) {
                        numeroProductosMercado = Math.floor(Math.random() * PRODUCTOSTOTALES.length)
                    }
                    productosMercado.push(PRODUCTOSTOTALES[numeroProductosMercado])
                    numerosProductosMercado.push(numeroProductosMercado)
                    preciosMercado.push(PRECIOPRODUCTOS[numeroProductosMercado])
                }

                // El jugador elige un producto
                mensaje = ""
                for (let i = 0; i < productosMercado.length; i++) {
                    mensaje += "\n" + (i + 1) + " = " + productosMercado[i]
                }
                opcionProducto = parseInt(prompt("Elige uno de los siguientes productos: " + mensaje))

                while (isNaN(opcionProducto) || opcionProducto < 1 || opcionProducto > productosMercado.length) {
                    opcionProducto = parseInt(prompt("Opción no válida. Elige nuevamente:" + mensaje))
                }

                // Convertir a índice real del array
                indiceArray = opcionProducto - 1

                // Validación y compra
                if (dinero < preciosMercado[indiceArray]) {
                    alert("No tienes suficiente dinero 😢")
                } else if (inventario.includes(productosMercado[indiceArray])) {
                    alert("Ya tienes este objeto en tu inventario")
                } else {
                    inventario.push(productosMercado[indiceArray])
                    dinero -= preciosMercado[indiceArray]
                    alert("Inventario: " + inventario)
                }

                // Si no han pasado 5 iteraciones se sigue con los mismos productos
            } else {

                // El jugador elige un producto
                mensaje = ""
                for (let i = 0; i < productosMercado.length; i++) {
                    mensaje += "\n" + (i + 1) + " = " + productosMercado[i]
                }
                opcionProducto = parseInt(prompt("Elige uno de los siguientes productos: " + mensaje))

                while (isNaN(opcionProducto) || opcionProducto < 1 || opcionProducto > productosMercado.length) {
                    opcionProducto = parseInt(prompt("Opción no válida. Elige nuevamente:" + mensaje))
                }

                // Convertir a índice real del array
                indiceArray = opcionProducto - 1

                // Validación y compra
                if (dinero < preciosMercado[indiceArray]) {
                    alert("No tienes suficiente dinero 😢")
                } else if (inventario.includes(productosMercado[indiceArray])) {
                    alert("Ya tienes este objeto en tu inventario")
                } else {
                    inventario.push(productosMercado[indiceArray])
                    dinero -= preciosMercado[indiceArray]
                    alert("Inventario: " + inventario)
                }
            }
        }
        // Muestro el estado actualizado de la granja tras cada acción
        alert("\nNivel de Felicidad de los Animales: " + felicidad + "\nNivel de Alimentos disponibles: " + alimentosDisponibles + "\nEstado del Establo: " + establo + "\nEstado de Salud: " + salud + "\nNúmero de Animales: " + totalAnimales + "\nDinero: " + dinero + "G" + "\nInventario: " + inventario)
    }
    // Mensaje final cuando el juego finaliza
    alert("Gracias por jugar a STEMFarm 🎮. ¡Hasta la próxima!")

</script>
