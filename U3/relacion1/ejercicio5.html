<script>
    // 5. Generar una Lista de 10 Caras o Cruces Aleatorios
    // Escribe una función llamada caraOCruz que devuelva "Cara" o "Cruz" al azar. Luego, crea otra función llamada listaCarasOCruces que use caraOCruz 10 veces para generar una lista de 10 resultados de "Cara" o "Cruz".

    function caraOCruz() {
        let resultado = "cara"
        caraCruz = Math.floor(Math.random() * 2)
        if (caraCruz == 1) {
            resultado = "cruz"
        }
        return resultado
    }

    function listaCarasOCruces(cantidad) {
        let listaCaraCruz = []
        for (i = 0; i < cantidad; i++) {
            listaCaraCruz.push(caraOCruz())
        }
        return listaCaraCruz
    }

    console.log(listaCarasOCruces(10))
</script>
