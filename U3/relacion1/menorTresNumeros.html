<script>
    //Crea una función llamada menorDeTres que reciba tres números y devuelva el menor de los tres.

    function menorDeTres(numero1, numero2, numero3) {

        let mensaje = ""

        if (numero1 < numero2 && numero1 < numero3) {
            mensaje = numero1 + " es el menor"

        } else if (numero2 < numero1 && numero2 < numero3) {
            mensaje = numero2 + " es el menor"

        } else {
            mensaje = numero3 + " es el menor"
        }

        return mensaje
    }

    let numero1 = Number(prompt("Introduce el primer número:"))
    let numero2 = Number(prompt("Introduce el segundo número:"))
    let numero3 = Number(prompt("Introduce el tercer número:"))

    console.log(menorDeTres(numero1, numero2, numero3))
</script>
