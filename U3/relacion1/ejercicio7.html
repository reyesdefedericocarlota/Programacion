<script>
    // 7. Juego: Adivina el Número
    // Crea una función juegoAdivinaNumero que genere un número aleatorio entre 1 y 10. Pídele al usuario que adivine el número, y dile si el número que ingresó es menor, mayor o igual al número generado.

    function juegoAdivinaNumero() {
        return Math.floor(Math.random() * 10) + 1
    }

    let adivinarNumero = juegoAdivinaNumero()
    let numeroUsuario = 0

    while (adivinarNumero != numeroUsuario) {
        numeroUsuario = Number(prompt("Adivina el número:"))

        if (numeroUsuario < adivinarNumero) {
            console.log("El numero que has ingresado es menor que el número a adivinar ")
        } else if (numeroUsuario > adivinarNumero) {
            console.log("El numero que has ingresado es mayor que el número a adivinar ")
        }
    }
    console.log("Has adivinado el número") 
</script>

<script>
    // Otra forma de hacerlo

    function juegoAdivinaNumero() {
        let numeroAleatorio = Math.floor(Math.random() * 10) + 1

        return numeroAleatorio
    }

    function numeroUsuario(numero) {

        let numeroAdivinar = juegoAdivinaNumero()
        let mensaje = ""

        if (numero < numeroAdivinar) {
            mensaje = "El número que has introducido es menor que el número a adivinar"
        } else if (numero > numeroAdivinar) {
            mensaje = "El número que has introducido es mayor que el número a adivinar"
        } else {
            mensaje = "El número que has introducido es el número a adivinar"
        }

        return mensaje
    }



    let usuarioNumero = Number(prompt("Adivina el número del 1 al 10:"))
    alert(numeroUsuario(usuarioNumero)) 
</script>
