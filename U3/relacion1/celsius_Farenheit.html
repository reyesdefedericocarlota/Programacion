<script>
    // Haz una función llamada celsiusAFahrenheit que reciba un valor en grados Celsius y devuelva su conversión a Fahrenheit usando la fórmula (Celsius * 9/5) + 32.

    function celsiusAFahrenheit(numero) {

        return (numero * 9 / 5) + 32
    }

    //----------------------------------MAIN------------

    let numero = Number(prompt("Introduce un número para convertirlo de grados Celsius a Farenheit:"))
    console.log(celsiusAFahrenheit(numero))
</script>
