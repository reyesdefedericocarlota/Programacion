<script>
    // 11. Simular un Juego de Piedra, Papel o Tijeras
    // Crea una función juegoPiedraPapelTijeras que genere aleatoriamente una elección entre "Piedra", "Papel" o "Tijeras" y permite al usuario jugar contra la máquina.

    function juegoPiedraPapelTijeras() {

        let opciones = ["piedra", "papel", "tijeras"]
        let eleccionMaquina = opciones[Math.floor(Math.random() * opciones.length)]

        return eleccionMaquina
    }

    function comprobarGanador(eleccionUsuario, opcionMaquina) {
        let ganaUsuario = false

        if (opcionMaquina == "tijeras" && eleccionUsuario == "piedra" || opcionMaquina == "papel" && eleccionUsuario == "tijeras" || opcionMaquina == "piedra" && eleccionUsuario == "papel") {
            ganaUsuario = true
        }

        return ganaUsuario
    }

    let eleccionJugador = prompt("Elige piedra, papel o tijeras: ")
    while (eleccionJugador != "piedra" && eleccionJugador != "papel" && eleccionJugador != "tijeras") {
        eleccionJugador = prompt("Elige piedra, papel o tijeras: ")
    }
    let tiradaMaquina = juegoPiedraPapelTijeras()

    if (tiradaMaquina == "tijeras" && eleccionJugador == "tijeras" || tiradaMaquina == "papel" && eleccionJugador == "papel" || tiradaMaquina == "piedra" && eleccionJugador == "piedra") {
        console.log(tiradaMaquina + " - " + eleccionJugador + " EMPATE")

    } else if (comprobarGanador(eleccionJugador, tiradaMaquina)) {
        console.log(tiradaMaquina + " - " + eleccionJugador + " GANA EL USUARIO")

    } else {
        console.log(tiradaMaquina + " - " + eleccionJugador + " GANA LA MÁQUINA")
    }

</script>
