<script>
    // 14. Calcular el promedio de un array
    // Crea una función llamada promedioArray que reciba un array de números y devuelva su promedio.

    function promedioArray(arrayNumeros) {
        let suma = 0
        for (let numero of arrayNumeros) {
            suma += numero
        }
        return suma / arrayNumeros.length
    }

    function crearArrayAleatorio0a99(tamanio) {
        for (let i = 0; i < tamanio; i++) {
            numeros.push(Math.floor(Math.random() * 100))
        }
    }

    numeros = []
    const TAMANIOARRAY = 8
    crearArrayAleatorio0a99(TAMANIOARRAY)
    console.log(promedioArray(numeros))
</script>
