<script>
    //Crea una función llamada esPar que reciba un número y devuelva true si es par o false si es impar.

    function esPar(numero) {

        numeroPar = false
        if (numero % 2 == 0) {

            numeroPar = true
        }

        return numeroPar
    }

    //----------------------------------MAIN------------

    let numero = Number(prompt("Introduce un número:"))
    console.log(esPar(numero))

</script>
