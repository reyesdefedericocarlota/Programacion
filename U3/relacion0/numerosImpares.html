<script>
    // 12. Obtener números impares de un array
    // Crea una función llamada obtenerImpares que reciba un array y devuelva un nuevo array con los números impares.

    function numerosAleatorios() {

        let numeros = []
        const TAMANIOARRAY = 8

        for (i = 0; i < TAMANIOARRAY; i++) {
            numeros.push(Math.floor(Math.random() * 100))
        }

        return numeros
    }


    function obtenerImpares(arrayNumerosImpares) {

        let numerosImpares = []

        for (let numero of arrayNumerosImpares) {
            if (numero % 2 != 0) {
                numerosImpares.push(numero)
            }

        }

        return numerosImpares

    }



    //----------------------------------MAIN------------
    let numeros = numerosAleatorios()

    alert("Array: " + numeros)
    alert("Numeros impares: " + obtenerImpares(numeros))
</script>
