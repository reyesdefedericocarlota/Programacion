<script>
    // 12. Obtener números impares de un array
    // Crea una función llamada obtenerImpares que reciba un array y devuelva un nuevo array con los números impares.

    function obtenerImpares(arrayNumeros) {
        arrayImpares = []
        for (let numero of arrayNumeros) {
            if (numero % 2 != 0) {
                arrayImpares.push(numero)
            }
        }
        return arrayImpares
    }

    numeros = [4, 6, 3, 8, 2, 9, 7, 13]
    console.log(obtenerImpares(numeros))
</script>
