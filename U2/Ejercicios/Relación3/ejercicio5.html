<script>
    // 5. **Combina Dos Listas de Compras (sin duplicados)**
    // - Tienes dos arrays con listas de compras. Quieres combinarlas en una sola, sin que se repitan elementos. Si ambos arrays tienen el mismo producto, debe aparecer solo una vez.
    // - Ejemplo: `["milk", "eggs", "bread"]` y `["bread", "butter", "cheese"]` debería devolver `["milk", "eggs", "bread", "butter", "cheese"]`.

    let alimentos1 = ["milk", "eggs", "bread"]
    let alimentos2 = ["bread", "butter", "cheese"]
    let alimentosCombinados = []

    for (let alimento of alimentos1) {
        alimentosCombinados.push(alimento)
    }
    for (i = 0; i < alimentos2.length; i++) {
        for (i = 0; i < alimentosCombinados.length; i++) {
            if (alimentosCombinados[0] == alimentos2[i]) {
                alimentosCombinados.pop
            }
            alimentosCombinados.push(alimentos2[i])
        }
    }
    console.log(alimentosCombinados)
</script>
