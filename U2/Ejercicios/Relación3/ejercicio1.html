<script>
    //1. Encuentra el Elemento Más Largo
    // Dado un array de palabras, escribe una función que encuentre la palabra más larga.
    // Ejemplo: ["apple", "banana", "kiwi", "watermelon"] debería devolver "watermelon".

    let frutas = ["apple", "banana", "kiwi", "watermelon"]
    let palabraMasLarga = 0
    let nombrePalabra = ""

    palabraMasLarga = frutas[0].length
    nombrePalabra = frutas[0]

    for (i = 0; i < frutas.length; i++) {

        if (palabraMasLarga < frutas[i].length) {
            palabraMasLarga = frutas[i].length
            nombrePalabra = frutas[i]
        }
    }
    console.log("La palabra más larga es: " + nombrePalabra)
</script>
